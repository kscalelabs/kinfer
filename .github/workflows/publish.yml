name: Publish Python and Rust Packages

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      publish_kinfer_rust:
        description: "Publish Rust package"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: "publish"
  cancel-in-progress: true

jobs:
  build-wheels:
    name: Build ${{ matrix.arch }} wheels
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            skip: "pp* *-musllinux*"
          - os: ubuntu-latest
            arch: aarch64
            skip: "pp* *-musllinux* cp313-*"
          - os: macos-latest
            arch: arm64
            skip: "pp* cp313-*"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install Rust target
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel
        shell: bash

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Cache pip, cibuildwheel and dist
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.cache/cibuildwheel
            dist
          key: ${{ runner.os }}-${{ matrix.arch }}-pip-cibw
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-pip-cibw

      - name: Install sccache
        run: |
          cargo install sccache

      - name: Build package
        env:
          CIBW_SKIP: ${{ matrix.skip }}
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_BUILD_VERBOSITY: 1
          CARGO_NET_RETRY: 2
          RUST_BACKTRACE: 1
          RUSTC_WRAPPER: sccache
          RUST_LOG: sccache=debug
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y libudev-devel pkgconfig python3-devel python3-pip python3-wheel &&
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_BEFORE_BUILD: pip install setuptools-rust
          CIBW_ENVIRONMENT: |
            PATH="/usr/local/bin:$HOME/.cargo/bin:$PATH"
            CARGO_NET_GIT_FETCH_WITH_CLI=true
        run: |
          cibuildwheel --output-dir dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: |
            dist/*.whl

  build-source-dist:
    name: Build and publish Python package (source distribution)
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
        shell: bash

      - name: Build source distribution
        run: |
          python -m build --sdist --outdir dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: |
            dist/*.tar.gz

  publish-wheels:
    needs: [build-wheels, build-source-dist]
    name: Publish Python wheels
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Move wheels to dist directory
        run: |
          mkdir -p final_dist
          find dist -name "*.whl" -exec mv {} final_dist/ \;
          find dist -name "*.tar.gz" -exec mv {} final_dist/ \;

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: final_dist/

  publish-rust:
    name: Build and publish Rust package
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_kinfer_rust }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install Rust target
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
        shell: bash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Cache Cargo dependencies
        uses: actions/cache@v2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Publish Kinfer Rust package to crates.io
        if: ${{ inputs.publish_kinfer_rust }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
