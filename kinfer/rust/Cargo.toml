[package]

name = "kinfer"
version = "0.1.0"
edition = "2021"

[dependencies]

futures-util = "0.3.30"
ndarray = "0.16.1"
ort = { version = "2.0.0-rc.6", features = [ "load-dynamic" ] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tar = "0.4"
thiserror = "1.0"

[dev-dependencies]
rand = "0.8"
